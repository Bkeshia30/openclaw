# This repo's root is a different project. This file exists only to send the
# build into salon-os/, which carries its own netlify.toml with the build
# command, Node version and the Next.js plugin.
#
# Deliberately nothing else here: when `base` is set, Netlify merges this file
# with the one in the base directory, and declaring the same plugin in both
# fails the build.
[build]
  base = "salon-os"
