# Netlify builds the salon-os app in this repo, not the repository root.
#
# The root of this repo is a different project with its own package.json. Without
# `base`, Netlify would try to build that instead and fail with an error that
# never mentions the real cause.
[build]
  base    = "salon-os"
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

# Runs the App Router, server actions and the auth middleware on Netlify's
# runtime. It also decides the publish directory, so this file deliberately
# does not set one.
[[plugins]]
  package = "@netlify/plugin-nextjs"
