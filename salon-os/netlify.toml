# Build settings for the salon-os app itself.
#
# When Netlify builds from the linked Git repo, the root netlify.toml points
# `base` here and these settings apply. When the app directory is deployed
# directly, this file is the whole config.
[build]
  command = "npm run build"

[build.environment]
  NODE_VERSION = "22"

[[plugins]]
  package = "@netlify/plugin-nextjs"
